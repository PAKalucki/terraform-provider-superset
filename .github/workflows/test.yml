name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit And Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Run unit tests
        run: go test ./...

      - name: Run acceptance tests
        env:
          SUPERSET_URL: http://127.0.0.1:8088
          SUPERSET_USERNAME: admin
          SUPERSET_PASSWORD: admin
        run: make testacc

      - name: Show test environment logs on failure
        if: failure()
        run: docker compose -f docker_compose/docker-compose.yaml logs --no-color

      - name: Tear down test environment
        if: always()
        run: ./scripts/testenv-down.sh
